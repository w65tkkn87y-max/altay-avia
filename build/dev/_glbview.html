<!doctype html><html><head><meta charset="utf-8"><title>glbview</title>
<style>body{margin:0;background:#dfe9f5}#v{width:1400px;height:800px}</style></head><body>
<div id="v"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/meshoptimizer@0.16.1/meshopt_decoder.js"></script>
<script src="js/heli3d.js"></script>
<script>
/* Просмотр site/models/<m>.glb с шести ракурсов → PNG через save_server (скопировать в site/) */
function frame(v){const o=v.orbit;const cx=o.target.x+o.dist*Math.sin(o.phi)*Math.sin(o.theta),cz=o.target.z+o.dist*Math.sin(o.phi)*Math.cos(o.theta),cy=o.target.y+o.dist*Math.cos(o.phi);v.camera.position.set(cx,cy,cz);v.camera.lookAt(o.target);v.renderer.render(v.scene,v.camera);}
async function save(name,dataUrl){await fetch('http://localhost:8766/save?name='+name,{method:'POST',body:dataUrl});}
const q=new URLSearchParams(location.search); const m=q.get('m')||'mi8amt';
const v=new Heli3D.Viewer(document.getElementById('v'),{transparent:false,background:0xeaf1f7,helipad:true,autoRotate:false,rotorState:'stop',maxDpr:1,fov:28}); v.running=false;
v.loadGLTF('models/'+m+'.glb?v='+Date.now(),{fit:1.15,ty:2.5},async (err,model)=>{
  if(err){document.title='ERR '+err; return;}
  for(const [name,theta,phi] of [['side',0,1.5],['front34',2.3,1.2],['front',Math.PI/2,1.35],['rear34',-2.5,1.1],['top',0.5,0.45],['left',Math.PI,1.5]]){ v.orbit.theta=theta; v.orbit.phi=phi; frame(v); await save('_'+m+'-'+name+'.png',v.renderer.domElement.toDataURL('image/png')); }
  document.title='ALL DONE rotors='+model.userData.rotors.length;
});
</script></body></html>
