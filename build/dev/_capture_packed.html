<!doctype html><html><head><meta charset="utf-8"><title>capture packed</title>
<style>body{margin:0;background:#888}#v{width:1600px;height:1000px}</style></head><body>
<div id="v"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/heli3d.js?v=dev"></script>
<script>
/* Статичные рендеры моделей компактного формата (img/3d/<m>.png и <m>-side.png): скопировать в site/, открыть ?m=as350.
   Картинки уходят на build/save_server.py (порт 8766), затем обрезаются build/dev/trim_renders.py */
const M = new URLSearchParams(location.search).get('m') || 'as350';
function frame(v){const o=v.orbit;const cx=o.target.x+o.dist*Math.sin(o.phi)*Math.sin(o.theta),cz=o.target.z+o.dist*Math.sin(o.phi)*Math.cos(o.theta),cy=o.target.y+o.dist*Math.cos(o.phi);v.camera.position.set(cx,cy,cz);v.camera.lookAt(o.target);v.renderer.render(v.scene,v.camera);}
async function save(name,dataUrl){await fetch('http://localhost:8766/save?name='+name,{method:'POST',body:dataUrl});}
async function run(){
  const box=document.getElementById('v');
  // ракурсы: 3/4 спереди-справа и правый борт; кадр — по модели (у Ми-8 длиннее балка и больше винт)
  const PRESETS = {
    as350: [{name:M+'.png',w:1600,h:1000,theta:0.85,phi:1.22,fit:1.5,ty:1.2,tx:-0.4,rotor:'idle',fov:26},{name:M+'-side.png',w:1600,h:800,theta:0.0,phi:1.52,fit:1.45,ty:1.45,tx:0.0,rotor:'stop',fov:22}],
    mi8: [{name:M+'.png',w:1600,h:1000,theta:0.85,phi:1.22,fit:1.16,ty:2.5,tx:-1.4,rotor:'idle',fov:26},{name:M+'-side.png',w:1600,h:800,theta:0.0,phi:1.52,fit:1.24,ty:2.8,tx:-1.6,rotor:'stop',fov:22}]
  };
  for(const j of (M==='as350'?PRESETS.as350:PRESETS.mi8)){
    box.style.width=j.w+'px';box.style.height=j.h+'px';box.innerHTML='';
    const v=new Heli3D.Viewer(box,{transparent:true,helipad:false,shadowOpacity:0.28,autoRotate:false,rotorState:j.rotor,maxDpr:1,fov:j.fov,viewOffsetX:0.5}); v.running=false;
    await new Promise((res,rej)=>v.loadPacked(M,'models/'+M+'.js?v='+Date.now(),'models/',{fit:j.fit,ty:j.ty,tx:j.tx,theta:j.theta,phi:j.phi},err=>err?rej(err):res()));
    await new Promise(r=>setTimeout(r,500));
    v.orbit.theta=j.theta; v.orbit.phi=j.phi; frame(v); frame(v); await save(j.name,v.renderer.domElement.toDataURL('image/png')); v.renderer.dispose();
  }
  document.title='ALL DONE';
}
window.addEventListener('load',()=>setTimeout(()=>run().catch(e=>{document.title='ERR '+e.message}),300));
</script></body></html>
