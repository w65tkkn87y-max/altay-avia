<!doctype html><html><head><meta charset="utf-8"><title>views</title>
<style>body{margin:0;background:#888}#v{width:1400px;height:800px}</style></head><body>
<div id="v"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/heli3d.js?v=1789493830"></script>
<script>
function frame(v){const o=v.orbit;const cx=o.target.x+o.dist*Math.sin(o.phi)*Math.sin(o.theta),cz=o.target.z+o.dist*Math.sin(o.phi)*Math.cos(o.theta),cy=o.target.y+o.dist*Math.cos(o.phi);v.camera.position.set(cx,cy,cz);v.camera.lookAt(o.target);v.renderer.render(v.scene,v.camera);}
async function save(name,dataUrl){await fetch('http://localhost:8766/save?name='+name,{method:'POST',body:dataUrl});}
async function run(){
  const box=document.getElementById('v');
  const q=new URLSearchParams(location.search); const m=q.get('m')||'as350';
  const views=[['side',0,1.5,1.3],['front34',2.3,1.2,1.15],['front',Math.PI/2,1.35,1.0],['rear34',-2.5,1.1,1.15],['top',0.5,0.45,1.15],['left',Math.PI,1.5,1.3]];
  for(const [name,theta,phi,fit] of views){
    box.innerHTML='';
    const v=new Heli3D.Viewer(box,{transparent:false,background:0xeaf1f7,helipad:true,autoRotate:false,rotorState:'stop',maxDpr:1,fov:28});
    v.running=false;
    const M=Heli3D.MODELS[m]; v.setModel(M.build(),Object.assign({},M.view,{theta,phi,fit}));
    (v.model.userData.rotors||[]).forEach(r=>{if(r.axis==='y')r.obj.rotation.y=0.4;});
    frame(v);frame(v);
    await save('_'+m+'-'+name+'.png',v.renderer.domElement.toDataURL('image/png')); v.renderer.dispose();
  }
  document.title='ALL DONE';
}
window.addEventListener('load',()=>setTimeout(run,300));
</script></body></html>
